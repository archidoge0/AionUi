name: GHAV AionUi 1872 complete i18n checks human

on:
  push:
    branches:
      - codex/ghav-aionui1872-i18n-human

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  i18n-check:
    name: I18n Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout fixed historical task source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archidoge0/AionUi
          ref: dfd3be1d1c24757f2c90fae92beb163cbd8a26fd
          persist-credentials: false
      - name: Assert fixed source and input files
        run: |
          test "$(git rev-parse HEAD)" = 'dfd3be1d1c24757f2c90fae92beb163cbd8a26fd'
          test "$(git rev-parse HEAD^{tree})" = 'bce00a43cf1d911daaf02b006426033c4f3e90e3'
          test -s bun.lock
          test -s scripts/check-i18n.js
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "GHAV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "GHAV_INPUT_LOCK=$(sha256sum bun.lock | cut -d' ' -f1)"
          echo "GHAV_I18N_SCRIPT=$(sha256sum scripts/check-i18n.js | cut -d' ' -f1)"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Setup bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
          cache: true
      - name: Install dependencies
        run: bun install --no-frozen-lockfile
      - name: Run postinstall
        run: npm run postinstall || true
      - name: Run i18n validation (warning-only)
        id: i18n
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-i18n.js 2>&1 | tee i18n-check.log
      - name: Publish i18n summary
        if: always()
        shell: bash
        run: |
          echo "## i18n validation" >> $GITHUB_STEP_SUMMARY
          if grep -q "⚠️" i18n-check.log; then
            echo "Missing/incomplete translations found. Please review warnings below." >> $GITHUB_STEP_SUMMARY
          else
            echo "No i18n warnings detected." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>i18n log</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat i18n-check.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          summary_sha=$(sha256sum "$GITHUB_STEP_SUMMARY" | cut -d' ' -f1)
          echo "GHAV_SUMMARY_SHA=$summary_sha"
      - name: Record complete i18n output witnesses
        if: always()
        run: |
          echo "GHAV_NODE_VERSION=$(node --version)"
          echo "GHAV_BUN_VERSION=$(bun --version)"
          echo "GHAV_BUN_CACHE_HIT=${{ steps.bun.outputs.cache-hit }}"
          echo "GHAV_FINAL_LOCK=$(sha256sum bun.lock | cut -d' ' -f1)"
          echo "GHAV_I18N_LOG=$(sha256sum i18n-check.log | cut -d' ' -f1)"
