name: GHAV AionUi 1872 Ubuntu unit tests

on:
  push:
    branches:
      - 'codex/ghav-aionui1872-*'

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  unit-tests:
    name: Unit Tests (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dfd3be1d1c24757f2c90fae92beb163cbd8a26fd
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.3'

      - name: Setup bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Record Bun setup outputs
        shell: bash
        run: |
          echo "GHAV_BUN_VERSION=${{ steps.setup-bun.outputs.bun-version }}"
          echo "GHAV_BUN_REVISION=${{ steps.setup-bun.outputs.bun-revision }}"
          echo "GHAV_BUN_CACHE_HIT=${{ steps.setup-bun.outputs.cache-hit }}"

      - name: Install dependencies
        run: bun install --no-frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Run extension system tests
        run: bunx vitest run
